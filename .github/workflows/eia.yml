name: EIA CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  cross-platform-upbp:
    name: UPBP Polyglot & Cross-Compilation
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build stage-0 C compiler (spark0)
        run: |
          mkdir -p bin
          gcc -O2 -Wall -Wextra -Iinclude -o bin/spark0 src/spark0_lexer.c src/spark0_parser.c src/spark0_codegen.c src/spark0_elf_writer.c src/spark0_main.c
          ./bin/spark0 compiler/core1.rx -o bin/core1
          echo "Stage-0 compiler successfully generated bin/core1 on ${{ matrix.os }}"

      - name: Cross-platform compiler output fixed-point verification
        run: |
          ./bin/spark0 compiler/core1.rx -o bin/core1_pass1
          ./bin/spark0 compiler/core1.rx -o bin/core1_pass2
          cmp bin/core1_pass1 bin/core1_pass2
          echo "Compiler fixed-point output verified on ${{ matrix.os }}"

      - name: Test UPBP polyglot binary compilation and shell trampoline (checks exit code 42)
        run: |
          ./bin/spark0 tests/hello_eia.rx -o bin/hello_upbp --upbp
          exit_code=0
          /bin/sh bin/hello_upbp || exit_code=$?
          echo "UPBP shell execution exit code: $exit_code"
          if [ "$exit_code" -ne 42 ]; then
            echo "Expected exit code 42, got $exit_code"
            exit 1
          fi
          echo "UPBP polyglot shell trampoline PASSED (exit code 42 verified on ${{ matrix.os }})"

      - name: Verify UPBP multi-OS headers and container triangulation
        run: |
          xxd -l 128 bin/hello_upbp || true
          python3 -c "
          with open('bin/hello_upbp', 'rb') as f:
              b = f.read()
          assert b[0:2] in (b'MZ', b'#!'), 'Missing MZ or shebang magic'
          assert b[60:62] == b'\x40\x01', 'Invalid e_lfanew offset to PE header'
          assert b[82:86] == b'tail', 'Missing tail trampoline directive'
          assert b[115:119] == b'exec', 'Missing exec trampoline directive'
          assert b[128:132] == b'\x7fELF', 'Missing ELF64 header'
          assert b[196] == 5, 'ELF program header must enforce strict W^X (PF_R | PF_X = 5)'
          assert b[320:324] == b'PE\x00\x00', 'Missing PE/COFF header'
          assert b[512:516] == b'\xcf\xfa\xed\xfe', 'Missing Mach-O 64 header'
          assert b[1152:1156] == bytes([69, 73, 72, 68]), 'Missing Universal Hologram Header (EIAH)'
          assert b[1156] == 2, 'Invalid Hologram version'
          print('All UPBP multi-OS container headers verified on ${{ matrix.os }}')
          "

      - name: Verify Multi-Architecture compilation targets (ARM64 & RISC-V 64)
        run: |
          ./bin/spark0 tests/hello_eia.rx -o bin/hello_arm64 --target=arm64
          ./bin/spark0 tests/hello_eia.rx -o bin/hello_riscv64 --target=riscv64
          python3 -c "
          with open('bin/hello_arm64', 'rb') as f:
              b_arm = f.read()
          assert b_arm[18] == 183, 'Invalid EM_AARCH64 (183) machine header'
          assert b_arm[68] == 5, 'ARM64 ELF segment must be strict W^X (PF_R | PF_X = 5)'

          with open('bin/hello_riscv64', 'rb') as f:
              b_rv = f.read()
          assert b_rv[18] == 243, 'Invalid EM_RISCV (243) machine header'
          assert b_rv[68] == 5, 'RISC-V 64 ELF segment must be strict W^X (PF_R | PF_X = 5)'
          print('Multi-architecture targets (EM_AARCH64 & EM_RISCV) verified on ${{ matrix.os }}')
          "

      - name: Stage-1 compiler subsystems cross-compilation
        run: |
          ./bin/spark0 compiler/runtime.rx -o bin/stage1_runtime
          ./bin/spark0 compiler/packaging.rx -o bin/stage1_packaging
          ./bin/spark0 compiler/frontend.rx -o bin/stage1_frontend
          echo "Stage-1 subsystems cross-compilation OK on ${{ matrix.os }}"

  eia-5gate-ring:
    name: EIA 5-Gate Ring & Self-Hosting
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build stage-0 C compiler (spark0) and stage-1 compiler (core1)
        run: |
          mkdir -p bin
          gcc -O2 -Wall -Wextra -Iinclude -o bin/spark0 src/spark0_lexer.c src/spark0_parser.c src/spark0_codegen.c src/spark0_elf_writer.c src/spark0_main.c
          ./bin/spark0 compiler/core1.rx -o bin/core1
          echo "Stage-0 compiler successfully generated bin/core1"

      - name: Stage-1 self-hosting compiler fixed-point verification (core1 compiling core1)
        run: |
          ./bin/core1 compiler/core1.rx -o /tmp/core1_pass1
          ./bin/core1 compiler/core1.rx -o /tmp/core1_pass2
          cmp /tmp/core1_pass1 /tmp/core1_pass2
          echo "Stage-1 self-hosting fixed-point self-compilation: OK"

      - name: Compile and run hello_eia test (checks exit code 42)
        run: |
          ./bin/core1 tests/hello_eia.rx -o /tmp/hello_eia
          exit_code=0
          /tmp/hello_eia || exit_code=$?
          echo "Exit code: $exit_code"
          if [ "$exit_code" -ne 42 ]; then
            echo "Expected exit code 42, got $exit_code"
            exit 1
          fi
          echo "hello_eia test PASSED (exit code 42 verified)"

      - name: Run full 5-gate verification
        run: |
          ./bin/core1 compiler/verify_5gate.rx -o bin/verify_5gate
          ./bin/verify_5gate
          echo "5-gate verification: PASSED"

      - name: Test Stage-1 core1 UPBP emission
        run: |
          ./bin/core1 tests/hello_eia.rx -o /tmp/core1_hello_upbp --upbp
          exit_code=0
          /bin/sh /tmp/core1_hello_upbp || exit_code=$?
          echo "Stage-1 UPBP shell exit code: $exit_code"
          if [ "$exit_code" -ne 42 ]; then
            echo "Expected exit code 42, got $exit_code"
            exit 1
          fi
          echo "Stage-1 core1 UPBP polyglot PASSED (exit code 42 verified)"

      - name: Verify Stage-1 Subsystems execution (Runtime DVAM, UPBP Packaging, Frontend)
        run: |
          ./bin/spark0 compiler/runtime.rx -o bin/stage1_runtime
          rt_code=0
          ./bin/stage1_runtime || rt_code=$?
          [ "$rt_code" -eq 16 ] && echo "Stage-1 runtime DVAM benchmark PASSED (exit code 16)"

          ./bin/spark0 compiler/packaging.rx -o bin/stage1_packaging
          pkg_code=0
          ./bin/stage1_packaging || pkg_code=$?
          [ "$pkg_code" -eq 42 ] && echo "Stage-1 UPBP packaging PASSED (exit code 42)"

          ./bin/spark0 compiler/frontend.rx -o bin/stage1_frontend
          fe_code=0
          ./bin/stage1_frontend || fe_code=$?
          [ "$fe_code" -eq 38 ] && echo "Stage-1 frontend parser PASSED (exit code 38)"

      - name: EIA Real Interoperability, Secure DVAM Loader & Schema Evolution Matrix Suite
        run: |
          ./bin/spark0 tests/client_v1.rx -o bin/client_v1
          ./bin/spark0 tests/provider_v2.rx -o bin/provider_v2

          # Build and test production eia-run dynamic loader
          gcc -O2 -Wall -Wextra -Iinclude -o bin/eia-run src/eia_loader.c
          run_code=0
          ./bin/eia-run bin/client_v1 bin/provider_v2 || run_code=$?
          if [ "$run_code" -ne 42 ]; then
            echo "Expected eia-run exit code 42, got $run_code"
            exit 1
          fi
          echo "Production eia-run client v1 -> provider v2 linking: PASSED (exit code 42)"

          # Verify fail-closed behavior on missing provider
          neg_code=0
          ./bin/eia-run bin/client_v1 >/dev/null 2>&1 || neg_code=$?
          if [ "$neg_code" -ne 1 ]; then
            echo "Expected eia-run missing symbol exit code 1, got $neg_code"
            exit 1
          fi
          echo "Production eia-run fail-closed missing symbol rejection: PASSED (exit code 1)"

          # Verify Stage-1 self-hosted core1 interoperability parity
          ./bin/core1 tests/client_v1.rx -o /tmp/core1_client_v1
          ./bin/core1 tests/provider_v2.rx -o /tmp/core1_provider_v2
          c1_code=0
          ./bin/eia-run /tmp/core1_client_v1 /tmp/core1_provider_v2 || c1_code=$?
          if [ "$c1_code" -ne 42 ]; then
            echo "Expected stage-1 core1 client/provider linking exit code 42, got $c1_code"
            exit 1
          fi
          echo "Stage-1 core1 client/provider dynamic linking via eia-run: PASSED (exit code 42)"

          # Official BLAKE3-64 Standard Reference Vector Suite (ASan + UBSan)
          gcc -O2 -Wall -Wextra -fsanitize=address,undefined -o bin/test_blake3_vectors tests/test_blake3_vectors.c
          ./bin/test_blake3_vectors
          echo "Official BLAKE3-64 Reference Vectors: 100% PASSED"

          # Fuzzing and malformed binary rejection suite (ASan + UBSan)
          gcc -O2 -Wall -Wextra -fsanitize=address,undefined -Iinclude -o bin/test_eia_fuzz tests/test_eia_fuzz.c
          ./bin/test_eia_fuzz
          echo "EIA Parser & Fuzz Robustness: 100% PASSED"

          # Full Schema Evolution & Secure DVAM Matrix Suite (ASan + UBSan)
          gcc -O2 -Wall -Wextra -fsanitize=address,undefined -Iinclude -o bin/test_eia_interop tests/test_eia_interop.c
          ./bin/test_eia_interop
          echo "EIA Independent Interoperability & Schema Evolution Matrix: 100% PASSED"

      - name: Verify Multi-Architecture Emission & Execution (ARM64 and RISC-V 64 via QEMU)
        run: |
          ./bin/spark0 tests/hello_eia.rx -o bin/hello_arm64 --target=arm64
          ./bin/spark0 tests/hello_eia.rx -o bin/hello_riscv64 --target=riscv64
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user || true
          if command -v qemu-aarch64 >/dev/null 2>&1; then
            arm_code=0
            qemu-aarch64 bin/hello_arm64 || arm_code=$?
            [ "$arm_code" -eq 42 ]
            echo "ARM64 execution via QEMU: PASSED (exit code 42)"
          fi
          if command -v qemu-riscv64 >/dev/null 2>&1; then
            riscv_code=0
            qemu-riscv64 bin/hello_riscv64 || riscv_code=$?
            [ "$riscv_code" -eq 42 ]
            echo "RISC-V 64 execution via QEMU: PASSED (exit code 42)"
          fi
